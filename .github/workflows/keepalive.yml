name: Keep Supabase Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sS -o /dev/null -w "%{http_code} - %{time_total}s" \
            https://shuleyetu-web.vercel.app/api/health
